name: Update Substack articles

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update latest articles
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://luvittor.substack.com/feed"
          max_post_count: 5
          commit_message: "docs: update latest Substack articles"
