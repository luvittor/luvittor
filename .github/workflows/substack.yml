name: Update Substack articles

on:
  push:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update latest articles
        env:
          SUBSTACK_FEED_URL: "https://luvittor.substack.com/feed"
          MAX_POST_COUNT: "5"
        run: node .github/scripts/update-substack.mjs

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest Substack articles"
          git push
